name: iOS Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version
          xcodebuild -showdestinations -project RutaUTP.xcodeproj -scheme RutaUTP > artifacts/destinations.log 2>&1
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          destinations = Path("artifacts/destinations.log").read_text()
          for line in destinations.splitlines():
              if "platform:iOS Simulator," not in line or "name:iPhone" not in line:
                  continue
              match = re.search(r"id:([A-Fa-f0-9-]{36})[, }]", line)
              if match:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"id={match.group(1)}\n")
                  print(f"Selected destination: {line.strip()}")
                  break
          else:
              print(destinations)
              raise SystemExit("No compatible iPhone simulator is available.")
          PYTHON

      - name: Build and test
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RutaUTP.xcodeproj \
            -scheme RutaUTP \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/RutaUTP.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Upload build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-test-results
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
