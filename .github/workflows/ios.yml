name: iOS Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      # Xcode 26.3 uses the iOS 26.2 SDK. The runner may have Xcode
      # installed without its runtime or any corresponding simulator devices.
      - name: Install iOS simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version
          xcodebuild -downloadPlatform iOS -buildVersion 26.2 -architectureVariant universal \
            2>&1 | tee artifacts/runtime-install.log
          xcrun simctl list runtimes -j | tee artifacts/runtimes.json

      - name: Create and boot iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl create "RutaUTP CI" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_id" -b \
            2>&1 | tee artifacts/simulator-boot.log
          xcrun simctl list devices -j > artifacts/devices.json
          xcodebuild -showdestinations -project RutaUTP.xcodeproj -scheme RutaUTP \
            2>&1 | tee artifacts/destinations.log
          if ! grep -Fq "$simulator_id" artifacts/destinations.log; then
            echo "::error::The created iPhone simulator is not a compatible destination. See the runtime and destination logs."
            exit 1
          fi

      - name: Build and test
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RutaUTP.xcodeproj \
            -scheme RutaUTP \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/RutaUTP.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Upload build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-test-results
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
