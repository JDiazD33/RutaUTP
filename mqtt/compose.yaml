services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: rutautp-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/passwords:/mosquitto/config/passwords:ro
      - ./data:/mosquitto/data
